<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MASTER SUDOKU - Zen Edition</title>
    <style>
        :root {
            --bg: #020617;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #22c55e;
            --text: #f8fafc;
            --grid-line: #64748b;
            --cell-fixed: #94a3b8;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; position: fixed; touch-action: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: var(--bg); color: var(--text);
            font-family: 'Inter', 'Segoe UI', sans-serif; user-select: none;
        }

        .exit-button {
            position: fixed; top: 12px; left: 12px; font-size: 26px; line-height: 1;
            color: rgba(255, 255, 255, 0.4); text-decoration: none; z-index: 9999;
            transition: all 0.2s ease; font-family: sans-serif; padding: 6px;
        }
        .exit-button:hover { color: #fff; transform: scale(1.1); }

        .header { margin-bottom: 6px; text-align: center; }
        h1 { color: var(--accent); margin: 0; font-size: 1.8rem; letter-spacing: 1px; }
        
        .diff-selector {
            display: flex; gap: 8px; justify-content: center; margin: 8px 0;
            width: 92vw; max-width: 440px;
        }
        .btn-diff {
            flex: 1; padding: 8px 0; background: #1e293b; border: 1px solid #475569;
            color: var(--text); border-radius: 8px; font-size: 0.8rem; font-weight: bold;
            cursor: pointer; text-transform: uppercase; transition: all 0.2s;
        }
        .btn-diff.active {
            background: var(--accent); color: var(--bg); border-color: var(--accent);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        #timer { font-family: monospace; font-size: 1.1rem; color: #94a3b8; }

        .sudoku-grid {
            display: grid; grid-template-columns: repeat(9, 1fr);
            background-color: var(--grid-line); border: 4px solid var(--grid-line);
            border-radius: 10px; width: 92vw; max-width: 440px;
            aspect-ratio: 1 / 1; margin: 8px 0; overflow: hidden;
        }

        .cell {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.03);
            display: flex; justify-content: center; align-items: center;
            font-size: 1.3rem; font-weight: 800; cursor: pointer;
            position: relative; color: #fff; transition: background 0.15s;
        }

        .cell:nth-child(3n) { border-right: 3px solid var(--grid-line); }
        .cell:nth-child(9n) { border-right: none; }
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 3px solid var(--grid-line); }

        .cell.fixed { color: var(--cell-fixed); background: rgba(15, 23, 42, 0.6); }

        .cell.selected { 
            background: #334155 !important; 
            box-shadow: inset 0 0 0 3px var(--accent);
            z-index: 10;
        }

        .cell.same-number { background: rgba(56, 189, 248, 0.3) !important; }

        .cell.error { 
            background: #7f1d1d !important;
            color: #ffffff !important;
        }

        .notes-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            width: 100%; height: 100%; font-size: 0.55rem; color: var(--accent); padding: 3px;
        }

        .numpad {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
            width: 92vw; max-width: 440px; margin-top: 6px;
        }

        .num-btn {
            background: #1e293b; border: 1px solid #475569; color: var(--text);
            padding: 12px 0; border-radius: 10px; font-size: 1.3rem;
            font-weight: bold; cursor: pointer; transition: opacity 0.3s, background 0.15s;
        }
        
        .num-btn.completed {
            opacity: 0.15;
            pointer-events: none;
        }

        .actions { display: flex; gap: 10px; width: 92vw; max-width: 440px; margin-top: 10px; }
        .actions button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 0.85rem; }
        .btn-matita { background: #334155; color: white; border: 1px solid #475569; }
        .btn-matita.active { background: var(--accent); color: var(--bg); }

        #win-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.92); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000;
            backdrop-filter: blur(5px); transition: all 0.3s ease;
        }
        .modal-content {
            background: #1e293b; padding: 30px; border-radius: 20px; text-align: center;
            border: 2px solid var(--accent); box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
            max-width: 320px; width: 80%;
        }
        .modal-content h2 { color: var(--success); margin: 0 0 10px 0; font-size: 2rem; }
        .modal-content p { margin: 10px 0; font-size: 1rem; color: var(--text); }
        .modal-content button {
            margin-top: 15px; width: 100%; padding: 12px; background: var(--accent);
            border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; color: var(--bg);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <a href="#" onclick="window.close(); return false;" class="exit-button" title="Torna all'Hub">×</a>
    
    <div class="header">
        <h1>MASTER SUDOKU</h1>
        <div style="display: flex; justify-content: center; gap: 20px; align-items: center; margin-top: 4px;">
            <div id="timer">00:00</div>
            <div style="font-family: monospace; font-size: 1.1rem; color: var(--success); font-weight: bold;">💎 <span id="pts">0</span></div>
        </div>
    </div>

    <div class="diff-selector">
        <button class="btn-diff active" onclick="setDifficulty('easy', this)">Facile</button>
        <button class="btn-diff" onclick="setDifficulty('medium', this)">Media</button>
        <button class="btn-diff" onclick="setDifficulty('hard', this)">Difficile</button>
    </div>

    <div class="sudoku-grid" id="grid"></div>

    <div class="numpad">
        <button class="num-btn" onclick="inputNum(1)">1</button>
        <button class="num-btn" onclick="inputNum(2)">2</button>
        <button class="num-btn" onclick="inputNum(3)">3</button>
        <button class="num-btn" onclick="inputNum(4)">4</button>
        <button class="num-btn" onclick="inputNum(5)">5</button>
        <button class="num-btn" onclick="inputNum(6)">6</button>
        <button class="num-btn" onclick="inputNum(7)">7</button>
        <button class="num-btn" onclick="inputNum(8)">8</button>
        <button class="num-btn" onclick="inputNum(9)">9</button>
        <button class="num-btn" onclick="inputNum(0)" style="color: var(--danger)">✖</button>
    </div>

    <div class="actions">
        <button id="btn-note" class="btn-matita" onclick="toggleNoteMode()">Matita: Off</button>
        <button onclick="checkWin()" style="background: var(--accent); color: var(--bg);">Verifica</button>
        <button onclick="initGame()" style="background: var(--success); color: var(--bg);">Nuovo</button>
    </div>

    <div id="win-modal" class="hidden">
        <div class="modal-content">
            <h2>🎉 VITTORIA!</h2>
            <p id="win-time">Tempo: 00:00</p>
            <p id="win-bonus" style="color: var(--success); font-weight: bold;">+500 💎 salvati!</p>
            <button onclick="closeWinModal()">GIOCA ANCORA</button>
        </div>
    </div>

    <script>
        let puzzle = [], notes = Array(81).fill().map(() => []);
        let selectedIdx = 0, noteMode = false, seconds = 0, timerInterval;
        let currentDifficulty = 'easy';
        
        let score = parseInt(localStorage.getItem('mp_score')) || parseInt(localStorage.getItem('ms_score')) || 0;
        localStorage.setItem('mp_score', score);
        document.getElementById('pts').innerText = score;
        let hasWon = false;

        function setDifficulty(diff, btn) {
            currentDifficulty = diff;
            document.querySelectorAll('.btn-diff').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            initGame();
        }

        function triggerGameWin(gameKey, pointsGained) {
            const target = window.opener || (window.parent !== window ? window.parent : null);
            if (target) {
                target.postMessage({
                    gameKey: gameKey,
                    points: pointsGained
                }, '*');
            }
        }

        function initGame() {
            clearInterval(timerInterval); seconds = 0; hasWon = false;
            document.getElementById('win-modal').classList.add('hidden');
            document.getElementById('timer').innerText = "00:00";
            timerInterval = setInterval(() => {
                seconds++;
                let m = Math.floor(seconds/60).toString().padStart(2,'0');
                let s = (seconds%60).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);
            generateLogic(); renderGrid(); selectCell(0);
        }

        function generateLogic() {
            let grid = Array(81).fill(0);
            const isValid = (g, p, n) => {
                let r = Math.floor(p/9), c = p%9;
                for(let i=0; i<9; i++) if(g[r*9+i]===n || g[i*9+c]===n) return false;
                let sr = Math.floor(r/3)*3, sc = Math.floor(c/3)*3;
                for(let i=0; i<3; i++) for(let j=0; j<3; j++) if(g[(sr+i)*9+sc+j]===n) return false;
                return true;
            };
            const solve = (g) => {
                for(let i=0; i<81; i++) if(g[i]===0) {
                    let nums = [1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-0.5);
                    for(let n of nums) if(isValid(g,i,n)) {
                        g[i]=n; if(solve(g)) return true; g[i]=0;
                    } return false;
                } return true;
            };
            solve(grid); puzzle = [...grid];

            let rem = 32;
            if (currentDifficulty === 'medium') rem = 44;
            if (currentDifficulty === 'hard') rem = 54;

            while(rem > 0) {
                let i = Math.floor(Math.random()*81);
                if(puzzle[i] !== 0) { puzzle[i] = 0; rem--; }
            }
            notes = Array(81).fill().map(() => []);
        }

        function renderGrid() {
            const gridDiv = document.getElementById('grid');
            gridDiv.innerHTML = '';
            puzzle.forEach((val, i) => {
                const cell = document.createElement('div');
                cell.className = 'cell' + (val !== 0 ? ' fixed' : '');
                cell.id = `cell-${i}`;
                if(val !== 0) cell.innerText = val;
                cell.onclick = () => selectCell(i);
                gridDiv.appendChild(cell);
            });
            updateNumpadStatus();
        }

        function selectCell(idx) {
            if (idx < 0) idx = 80; if (idx >= 81) idx = 0;
            selectedIdx = idx; const cellVal = puzzle[idx] || 0;

            document.querySelectorAll('.cell').forEach((cell, i) => {
                cell.classList.remove('selected', 'same-number');
                if(i === idx) cell.classList.add('selected');
                if(cellVal !== 0 && puzzle[i] === cellVal) cell.classList.add('same-number');
            });
        }

        function updateNumpadStatus() {
            const counts = Array(10).fill(0);
            puzzle.forEach(val => { if (val !== 0) counts[val]++; });
            const buttons = document.querySelectorAll('.num-btn');
            buttons.forEach(btn => {
                const n = parseInt(btn.innerText);
                if (n >= 1 && n <= 9) {
                    if (counts[n] >= 9) btn.classList.add('completed');
                    else btn.classList.remove('completed');
                }
            });
        }

        function inputNum(n) {
            const cell = document.getElementById(`cell-${selectedIdx}`);
            if(!cell || cell.classList.contains('fixed')) return;
            cell.classList.remove('error');
            if(n === 0) {
                puzzle[selectedIdx] = 0; notes[selectedIdx] = []; cell.innerText = '';
            } else if(noteMode) {
                puzzle[selectedIdx] = 0;
                let nts = notes[selectedIdx];
                if(nts.includes(n)) nts = nts.filter(x => x !== n);
                else nts.push(n);
                notes[selectedIdx] = nts; renderNotes(cell, nts);
            } else {
                puzzle[selectedIdx] = n; notes[selectedIdx] = [];
                cell.innerText = n; cell.style.color = "var(--accent)";
            }
            selectCell(selectedIdx);
            updateNumpadStatus();
        }

        function renderNotes(cell, nts) {
            cell.innerHTML = '<div class="notes-grid"></div>';
            const container = cell.querySelector('.notes-grid');
            for(let i=1; i<=9; i++) {
                const div = document.createElement('div');
                div.innerText = nts.includes(i) ? i : '';
                container.appendChild(div);
            }
        }

        function toggleNoteMode() {
            noteMode = !noteMode;
            const btn = document.getElementById('btn-note');
            btn.innerText = noteMode ? "Matita: On" : "Matita: Off";
            btn.classList.toggle('active', noteMode);
        }

        function checkWin() {
            let win = true;

            for (let i = 0; i < 81; i++) {
                if (puzzle[i] === 0) {
                    win = false;
                    break;
                }
            }

            const errorCells = new Set();
            for (let i = 0; i < 81; i++) {
                let val = puzzle[i];
                if (val === 0) continue;

                let r = Math.floor(i / 9);
                let c = i % 9;

                for (let j = 0; j < 81; j++) {
                    if (i === j) continue;
                    let r2 = Math.floor(j / 9);
                    let c2 = j % 9;
                    let sameBlock = (Math.floor(r / 3) === Math.floor(r2 / 3)) && (Math.floor(c / 3) === Math.floor(c2 / 3));

                    if ((r === r2 || c === c2 || sameBlock) && puzzle[j] === val) {
                        errorCells.add(i);
                        errorCells.add(j);
                        win = false;
                    }
                }
            }

            document.querySelectorAll('.cell').forEach((cell, i) => {
                if (errorCells.has(i)) {
                    cell.classList.add('error');
                } else {
                    cell.classList.remove('error');
                }
            });

            if(win) { 
                clearInterval(timerInterval); 
                let bonus = currentDifficulty === 'easy' ? 300 : (currentDifficulty === 'medium' ? 500 : 800);

                if (!hasWon) {
                    hasWon = true;
                    score += bonus;
                    localStorage.setItem('mp_score', score);
                    document.getElementById('pts').innerText = score;
                    triggerGameWin('sudoku', bonus);
                }

                document.getElementById('win-time').innerText = "Tempo: " + document.getElementById('timer').innerText;
                document.getElementById('win-bonus').innerText = `+${bonus} 💎 salvati!`;
                document.getElementById('win-modal').classList.remove('hidden');
            }
        }

        function closeWinModal() {
            document.getElementById('win-modal').classList.add('hidden');
            initGame();
        }

        document.addEventListener('keydown', (e) => {
            if(e.key >= 1 && e.key <= 9) inputNum(parseInt(e.key));
            if(e.key === 'Backspace' || e.key === '0' || e.key === 'Delete') inputNum(0);
            if(e.key === 'ArrowUp') { e.preventDefault(); selectCell(selectedIdx - 9); }
            if(e.key === 'ArrowDown') { e.preventDefault(); selectCell(selectedIdx + 9); }
            if(e.key === 'ArrowLeft') { e.preventDefault(); selectCell(selectedIdx - 1); }
            if(e.key === 'ArrowRight') { e.preventDefault(); selectCell(selectedIdx + 1); }
            if(e.key.toLowerCase() === 'n') toggleNoteMode();
            if(e.key === 'Enter') checkWin();
        });

        initGame();
    </script>
</body>
</html>
